<!--
精选课程维护说明

当前公开效果
- Selected Coursework 的插入入口已在 content/background.html 中停用，网页暂不展示此标题、TBD 或课程名。
- 本文件和下方注释模板保留，方便以后启用。

恢复课程区块
- 打开 content/background.html，将 SELECTED_COURSEWORK_DISABLED 改为 SELECTED_COURSEWORK。
- 运行 npm.cmd run build 后，课程区块会重新出现在 Education 下方。
- 如果只恢复区块而未填写条目，会显示 Selected Coursework 标题和 TBD。

开始填写课程
1. 编辑 content/coursework.html；启用插入入口后，构建脚本会自动把它插入 Background 页。
   不需要直接修改 dist/background.html，也不需要为每门课修改构建脚本。
2. 删除 section 内显示 TBD 的 p 段落。
3. 找到下方“课程列表示例模板”，去掉包含 ul 列表代码的注释块首尾注释符号。
4. 每门课对应一个 li；复制 li 即可增加课程。整个列表保留一个 ul 外层即可。
5. 课程名需要翻译时，同步修改 data-en（英文）、data-zh（中文）以及标签内默认英文正文。
   官方英文课程名若两种语言保持一致，可以改成普通文本，例如 li 中只写课程官方名称。
6. coursework-meta 一行可以填写课程编号、学期或成绩；不需要这些信息时删除整个 span。
7. 课程名也可以链接到自己的课程项目，在名称外包一层 a：
   <a href="course-projects.html#your-project-slug"><span data-en="Course name" data-zh="课程名称">Course name</span></a>
   链接中的 your-project-slug 必须与 content/course-projects.html 中对应 article 的 id 一致。
   翻译属性放在链接内的 span 上，便于保留链接本身。
8. 在 HTML 属性中，双引号写为 &quot;，与号写为 &amp;。

本地检查与发布
9. 在仓库根目录运行 npm.cmd run build，更新 dist/background.html。
10. 运行 npm.cmd run dev，打开 http://127.0.0.1:8000/background.html 查看。
    检查中英文切换、手机排版，以及课程链接（如果填写了链接）。
11. 确认后用 git diff 查看修改，再提交并推送：
    git add content/coursework.html content/course-projects.html content/background.html dist
    git commit -m "Update coursework and course projects"
    git push origin main
-->
